<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>FORGE | Training</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e5e7eb;background:#0b1220}*{box-sizing:border-box}body{margin:0;max-width:850px;margin:auto;padding:18px 16px 92px}h1{font-size:25px;margin:6px 0}h2{font-size:19px}p,small{color:#aab4c5}.card{background:#172235;border:1px solid #29374d;border-radius:16px;padding:16px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{background:#283954;padding:5px 10px;border-radius:999px;font-size:12px}.muted{color:#aab4c5}button,select,input{font:inherit;border-radius:9px;border:1px solid #40516b;background:#0e1829;color:#f4f6fa;padding:10px;min-width:0}button{cursor:pointer;background:#1f3a59}button.primary{background:#22c55e;color:#05210e;border:none;font-weight:700}button.danger{background:#552c37}input[type=number]{width:85px}input[type=date]{max-width:165px}label{font-size:13px;color:#b9c5d6}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0b1220;border-top:1px solid #334155;padding:8px;z-index:10}nav button{border:0;background:transparent;font-size:12px;padding:10px 8px}nav button.active{color:#4ade80}.exercise{border-top:1px solid #334155;padding:14px 0}.sets{display:grid;grid-template-columns:35px 1fr 1fr 1fr;gap:6px;align-items:center;margin:6px 0}.sets input{width:100%}.wide{width:100%}details summary{cursor:pointer}ul{padding-left:20px;line-height:1.55}.hidden{display:none}.tag{font-size:12px;color:#93c5fd}.stats{font-size:25px;font-weight:750;color:#f8fafc}a{color:#86efac}textarea{width:100%;background:#0e1829;color:white;border:1px solid #40516b;border-radius:9px;padding:9px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media print{nav,button{display:none!important}body{background:white;color:black}.card{border:1px solid #aaa;background:white}p,small{color:#333}}</style></head><body><header class="row"><div><div class="tag">8-WEEK PERFORMANCE SYSTEM</div><h1>FORGE <span style="color:#4ade80">●</span></h1></div><span class="pill">Offline-first • Local data</span></header><div id="app"></div><nav id="nav"></nav><script>
const DAYS=['Push','2 km + Athletic A','Pull','2 km + Athletic B','Legs + Athletic C','Rest','Rest'];
const WORK={0:[['Bench press',3,'6-8'],['Incline dumbbell press',3,'8-10'],['Seated shoulder press',3,'8-10'],['Lateral raise',3,'12-15'],['Triceps pushdown',3,'10-12'],['Overhead triceps extension',2,'10-12'],['Dead bug',3,'8/side']],2:[['Lat pulldown / pull-up',3,'8-10'],['Chest-supported row',3,'8-10'],['Cable row',2,'10-12'],['Reverse fly',3,'12-15'],['Biceps curl',3,'10-12'],['Hammer curl',2,'10-12'],['Back extension',3,'10-12'],['Bird dog',2,'8/side']],4:[['Squat',3,'6-8'],['Romanian deadlift',3,'8-10'],['Bulgarian split squat',3,'8/leg'],['Leg curl',3,'10-12'],['Calf raise',3,'12-15'],['Hip abduction',2,'12-15'],['Copenhagen plank',2,'20s/side'],['Pallof press',3,'10/side'],['Suitcase carry',2,'30 sec/side'],['Backward sled drag',2,'20 sec']],1:[['Sled push',4,'20 sec'],['Kettlebell swing',3,'12'],['Step-up',3,'8/leg'],['Plank',3,'30s']],3:[['Kettlebell clean and press',3,'6/side'],['Lateral lunge',3,'8/side'],['Bear crawl',3,'20 sec'],['Cable chop',3,'10/side']],5:[['Suitcase carry',3,'30 m/side'],['Farmer carry',3,'40 m'],['Backward sled drag',4,'20 m'],['Glute bridge',3,'12'],['Side plank',2,'30s/side']]};
const localISO=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;const mondayOf=(date)=>{let t=new Date(date.getFullYear(),date.getMonth(),date.getDate());t.setDate(t.getDate()-(t.getDay()+6)%7);return localISO(t)};const KEY='forge-training-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}};db.logs ||= {};db.settings ||= {start:mondayOf(new Date()),weight:210};db.weights ||= {};db.nutrition ||= {};db.settings.age ||= 22;db.settings.height ||= 183;db.settings.sex ||= 'male';let calorieDate=localISO(new Date());let progressDay=0, progressExercise=0, progressMetric='weight';let tab='Home';let chosen=((new Date().getDay()+6)%7);let chosenWeek=1;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateFor=(w,d)=>{let t=new Date(db.settings.start+'T12:00:00');t.setDate(t.getDate()+(w-1)*7+d);return localISO(t)};const logKey=(w,d)=>`${w}-${d}`;const log=(w,d)=>db.logs[logKey(w,d)]||{};const weekNow=()=>Math.min(8,Math.max(1,Math.floor((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-new Date(db.settings.start+'T00:00:00'))/604800000)+1));const todayDay=()=>((new Date().getDay()+6)%7);
const endDate=()=>{let d=new Date(db.settings.start+'T12:00:00');d.setDate(d.getDate()+55);return localISO(d)};
const totalDone=()=>Object.entries(db.logs).filter(([k,v])=>v.done&&+k.split('-')[1]<5).length;
const programEnded=()=>localISO(new Date())>endDate();
const weightEntries=()=>Object.entries(db.weights).filter(([d,v])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number(v)>0).sort((a,b)=>a[0].localeCompare(b[0]));
const fmtWeight=n=>Number(n).toFixed(1).replace(/\.0$/,'');
const weightGraph=()=>{let pts=weightEntries();if(!pts.length)return '<p>No weigh-ins yet. Enter your weight above to begin your graph.</p>';if(pts.length===1)return '<p>First entry: '+fmtWeight(pts[0][1])+' lb. Add another day to see a trend.</p>';let vals=pts.map(x=>+x[1]),min=Math.min(...vals)-1,max=Math.max(...vals)+1,span=max-min||1,w=620,h=180;let coords=pts.map((p,i)=>[30+i*(w-60)/(pts.length-1),h-20-(+p[1]-min)/span*(h-45)]);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Body weight over time" style="width:100%;height:auto"><line x1="30" y1="${h-20}" x2="${w-30}" y2="${h-20}" stroke="#607086"/><polyline fill="none" stroke="#4ade80" stroke-width="3" points="${coords.map(c=>c.join(',')).join(' ')}"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="#bbf7d0"/>`).join('')}<text x="5" y="16" fill="#aab4c5" font-size="12">${fmtWeight(max)} lb</text><text x="5" y="${h-5}" fill="#aab4c5" font-size="12">${fmtWeight(min)} lb</text></svg><div class="row"><small>${pts[0][0]}</small><small>${pts.at(-1)[0]}</small></div>`};
function recordWeight(){let date=$('weighDate').value,value=Number($('weighValue').value);if(!date||!Number.isFinite(value)||value<70||value>700){alert('Enter a valid date and weight in pounds.');return}db.weights[date]=value;save();render()}
function summary(w,d){let current=log(w,d),prev=w>1?log(w-1,d):{},isRun=[1,3].includes(d),lines=[];if(!current.done)return '<p>Finish and mark this workout complete to see your summary.</p>';if(isRun){let parse=t=>{let a=String(t||'').split(':').map(Number);return a.length===2&&a.every(Number.isFinite)?a[0]*60+a[1]:null};let now=parse(current.runTime),before=parse(prev.runTime);if(now!==null&&before!==null){let diff=before-now;lines.push(diff>0?`2 km run improved by ${diff} seconds compared with last week.`:diff<0?`2 km run was ${-diff} seconds slower than last week. Consider recovery, terrain and effort.`:'2 km run time matched last week.')}else if(now!==null)lines.push('2 km run recorded: '+escape(current.runTime)+'.');else lines.push('Next time, record your 2 km time to track pace.')}let better=0,same=0;for(let i=0;i<(WORK[d]||[]).length;i++){let now=current[`ex${i}s0`]||{},old=prev[`ex${i}s0`]||{};if(now.weight&&old.weight&&Number(now.weight)>Number(old.weight))better++;else if(now.weight&&old.weight&&Number(now.weight)===Number(old.weight)&&Number(now.reps)>Number(old.reps))better++;else if(now.weight&&old.weight)same++}if(better)lines.push(`${better} exercise(s) improved in load or first-set reps versus last week.`);if(same)lines.push(`${same} exercise(s) without a recorded increase; try adding a controlled rep before weight.`);if(!better&&!same)lines.push('Log load and reps for each set to unlock week-over-week comparisons.');if(current.rpe&&Number(current.rpe)>=9)lines.push('High effort today. Prioritize sleep and avoid forcing heavier weights next session.');else lines.push('Progress gradually while keeping good form and 1–3 reps in reserve.');return '<ul>'+lines.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function dailySummary(){let d=todayDay(),w=weekNow();return `<div class="card"><h2>Daily training summary</h2><small>${dateFor(w,d)} · ${DAYS[d]}</small>${summary(w,d)}</div>`}
function endCelebration(){return `<div class="card" style="border-color:#4ade80"><h2>🎉 CONGRATULATIONS — 8 WEEKS COMPLETE!</h2><p>You reached the end of your FORGE program. You completed ${totalDone()} of 40 scheduled training sessions. Review your strength, run times and weight trend, and celebrate the consistency you've built.</p><button class="primary" onclick="navigate('Progress')">See your results →</button></div>`}

function navigate(t){tab=t;render()}function render(){const tabs=['Home','Train','Progress','Calories','Program','Settings'];$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="navigate('${t}')">${t}</button>`).join('');$('app').innerHTML=({Home:home,Train:train,Progress:progress,Calories:calories,Program:program,Settings:settings})[tab]();}
function home(){let w=weekNow(),d=todayDay(),completed=Object.keys(db.logs).filter(k=>k.startsWith(w+'-')&&+k.split('-')[1]<5&&db.logs[k].done).length,daysLeft=Math.max(0,Math.ceil((new Date(endDate()+'T23:59:59')-new Date())/86400000));return `${programEnded()?endCelebration():''}<div class="card"><div class="tag">TODAY'S TRAINING</div><h2>${DAYS[d]}</h2><p>${new Intl.DateTimeFormat('en-CA',{weekday:'long',month:'long',day:'numeric'}).format(new Date())} • Week ${w} of 8</p><small>${log(w,d).done?'✓ Already logged today':'Ready to log — entries save automatically'}</small><button class="primary wide" onclick="chosenWeek=${w};chosen=${d};navigate('Train')">Open today's workout →</button></div><div class="grid"><div class="card"><div class="muted">Sessions this week</div><div class="stats">${completed}/5</div></div><div class="card"><div class="muted">Days until program ends</div><div class="stats">${daysLeft}</div><small>${endDate()}</small></div><div class="card"><div class="muted">Sessions completed</div><div class="stats">${totalDone()}/40</div></div></div><div class="card"><h2>Quick weigh-in</h2><div class="row"><label>Date <input id="weighDate" type="date" value="${localISO(new Date())}"></label><label>Weight (lb) <input id="weighValue" type="number" min="70" max="700" step="0.1" placeholder="210"></label><button class="primary" onclick="recordWeight()">Save weight</button></div></div>${dailySummary()}<div class="card"><h2>Weekly schedule</h2>${DAYS.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #334155"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]} · ${x}</span><span>${log(w,i).done?'✓ Complete':'—'}</span></div>`).join('')}</div><p>Weeks 4 and 8 are deload weeks. Use controlled effort and recover between sessions.</p>`}

function train(){let d=chosen,w=chosenWeek,L=log(w,d),isRun=[1,3].includes(d),deload=[4,8].includes(w);return `<div class="card"><div class="row"><label>Week <select onchange="chosenWeek=+this.value;render()">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label><label>Day <select onchange="chosen=+this.value;render()">${DAYS.map((v,i)=>`<option value="${i}" ${d===i?'selected':''}>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</option>`).join('')}</select></label></div><h2>${DAYS[d]}</h2><small>${dateFor(w,d)} • ${deload?'Deload: reduce sets ~30–50%, keep effort easy':'Progress only with good form and recovery'}</small></div>${d>=5?'<div class="card">Weekend rest and recovery.</div>':`${isRun?`<div class="card"><h2>2 km run</h2>${runGoal(w,d)}<div class="grid">${field(w,d,'runTime','Time (min:sec)','text')}${field(w,d,'runRpe','Effort (1–10)','number')}${field(w,d,'runNotes','Run notes','text')}</div><p>Warm up 5–10 minutes. Run 2 km at a sustainable pace; avoid sprinting every session.</p></div>`:''}<div class="card"><h2>${isRun?'Athletic circuit':'Strength workout'}</h2><small>Weight in kg or lb—use the same unit consistently. Enter repetitions or seconds only. For carries and sleds, record duration in seconds.</small>${WORK[d].map((e,i)=>exercise(w,d,e,i,deload)).join('')}</div><div class="card"><div class="grid">${field(w,d,'minutes','Total workout minutes','number')}${field(w,d,'rpe','Session effort 1–10','number')}</div><p><label>Workout notes</label><textarea rows="2" oninput="update(${w},${d},'notes',this.value)">${escape(L.notes||'')}</textarea></p><button class="primary wide" onclick="update(${w},${d},'done',true);render()">${L.done?'✓ Completed — Save again':'Mark workout complete'}</button>${L.done?'<div class="card"><h2>Workout summary</h2>'+summary(w,d)+'</div>':''}</div>`}`}
function field(w,d,k,title,type){let v=log(w,d)[k]??'';return `<label>${title}<input class="wide" type="${type}" value="${escape(v)}" oninput="update(${w},${d},'${k}',this.value)"></label>`}


function priorExercise(w,d,i){for(let k=w-1;k>=1;k--){let L=log(k,d),sets=Array.from({length:WORK[d][i][1]},(_,j)=>L['ex'+i+'s'+j]).filter(v=>v&&(v.reps!==''&&v.reps!==undefined||v.weight!==''&&v.weight!==undefined));if(sets.length)return {week:k,sets};}return null}
function timedDirection(e){return /sled push|bear crawl|backward sled drag|farmer carry|suitcase carry/i.test(e[0])?'faster':'longer'}
function isTimedExercise(e){return /sec|seconds|\bs\/side\b|\d+s\b/i.test(e[2])||/plank|carry|sled|crawl|drag|hold/i.test(e[0])}
function exerciseGoal(w,d,e,i,deload){
const timed=isTimedExercise(e),prev=priorExercise(w,d,i),target=String(e[2]),range=target.match(/(\d+)\s*[-–]\s*(\d+)/),single=target.match(/(\d+)/),upper=range?+range[2]:single?+single[1]:null;
if(deload)return 'Deload week: use lighter loads or easier times. Do not increase this week.';
if(!prev)return timed?'First session: '+target+'. '+(timedDirection(e)==='faster'?'Cover the same distance quicker next time.':'Aim to hold longer next time.'):'First session: aim for '+target+' clean reps. Record your load to get an increase recommendation.';
const sets=prev.sets,nums=sets.map(v=>Number(v.reps)).filter(v=>Number.isFinite(v)&&v>0),loads=sets.map(v=>Number(v.weight)).filter(v=>Number.isFinite(v)&&v>0),load=loads.length?loads[0]:null;
if(timed){let dir=timedDirection(e),best=nums.length?(dir==='faster'?Math.min(...nums):Math.max(...nums)):null;if(best===null)return 'First session: record seconds; goal is to '+(dir==='faster'?'finish the fixed distance faster.':'hold longer with good form.');let next=dir==='faster'?Math.max(1,Math.floor(best*.97)):Math.ceil(best*1.05);return 'Last session: '+best+' sec. '+(dir==='faster'?'Faster target: '+next+' sec or less (same distance, ~3% quicker).':'Endurance target: '+next+' sec or more (~5% longer).');}
if(load===null)return 'Last session: '+(nums.join(', ')||'no reps')+' reps. Add load to unlock weight guidance.';
const complete=sets.length>=e[1]&&nums.length>=e[1]&&upper!==null&&nums.slice(0,e[1]).every(n=>n>=upper);
if(complete){let low=+(load*1.025).toFixed(1),high=+(load*1.05).toFixed(1);return 'Last load: '+load+'. Increase recommended: '+low+'–'+high+' (same units; nearest available increment). All '+e[1]+' sets met '+upper+' reps.';}
return 'Last load: '+load+'. Keep this weight. Last reps: '+(nums.join(' / ')||'not recorded')+'. Aim for '+(upper||'target')+' reps on every set before increasing.';
}
function runGoal(w,d){if(w===4||w===8)return '<p class="tag">Recovery week: run comfortably; no speed target.</p>';let prior=null;for(let k=w-1;k>=1;k--){let sec=runSeconds(log(k,d).runTime);if(sec!==null){prior=sec;break;}}if(prior===null)return '<p class="tag">First run: record your baseline 2 km time.</p>';let goal=Math.max(1,Math.round(prior*.99));return '<p class="tag">2 km target: '+Math.floor(goal/60)+':'+String(goal%60).padStart(2,'0')+' (about 1% faster, if recovered).</p>'}
function refreshExerciseGoal(w,d,i){let el=document.getElementById('goal-'+w+'-'+d+'-'+i);if(el)el.textContent=exerciseGoal(w,d,WORK[d][i],i,[4,8].includes(w))}
function exercise(w,d,e,i,deload){let prev=w>1?log(w-1,d):{},n=deload?Math.max(1,Math.ceil(e[1]*.6)):e[1],timed=isTimedExercise(e),goal=exerciseGoal(w,d,e,i,deload);return `<div class="exercise"><strong>${escape(e[0])}</strong> <span class="pill">${n} sets × ${e[2]}</span><div class="tag" id="goal-${w}-${d}-${i}">${escape(goal)}</div>${Array.from({length:n},(_,j)=>{let k=`ex${i}s${j}`,v=log(w,d)[k]||{},p=prev[k]||{};return `<div class="sets"><small>${j+1}</small><div><input aria-label="Weight" placeholder="${timed?'Optional load':'Load'}" value="${escape(v.weight||'')}" oninput="updateSet(${w},${d},'${k}','weight',this.value);refreshExerciseGoal(${w},${d},${i})"><small style="display:block"> ${timed?'Optional load': 'Last: '+escape(p.weight||'—')}</small></div><div><input aria-label="Reps or seconds" placeholder="${timed?'Seconds':'Reps'}" value="${escape(v.reps||'')}" oninput="updateSet(${w},${d},'${k}','reps',this.value);refreshExerciseGoal(${w},${d},${i})"><small style="display:block">${timed?(timedDirection(e)==='faster'?'Speed target':'Hold target'):'Reps target'}: ${escape(e[2])}</small></div><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" ${v.done?'checked':''} onchange="updateSet(${w},${d},'${k}','done',this.checked)">Done</label></div>`}).join('')}</div>`}

function update(w,d,k,v){let key=logKey(w,d);db.logs[key]||={};db.logs[key][k]=v;save()}function updateSet(w,d,k,f,v){let key=logKey(w,d);db.logs[key]||={};db.logs[key][k]||={};db.logs[key][k][f]=v;save()}
function program(){return `<div class="card"><h2>8-week progression</h2><table><tr><th>Week</th><th>Strength</th><th>Running</th></tr>${Array.from({length:8},(_,i)=>`<tr><td>${i+1}</td><td>${i===3||i===7?'Deload sets 30–50%':i===0?'Find starting weights':'Add reps; then small load increases'}</td><td>2 km on Tue/Thu; improve comfort and pace</td></tr>`).join('')}</table></div><div class="card"><h2>Training rules</h2><p>Leave 1–3 reps in reserve on strength work. Increase load by the smallest available increment after reaching the upper rep target across all sets with good form. For carries and sleds, increase distance or load gradually, not both at once.</p><p>Warm up 5–10 minutes. Stop or modify exercises that provoke sharp or worsening pain. Two 2 km runs per week build general fitness but are not a sufficient half-marathon plan by themselves.</p></div>`}

function workoutProgress(){
let d=progressDay, ex=WORK[d]||[], isRun=[1,3].includes(d);
let selection=progressExercise===-1&&isRun?'run':String(progressExercise);
let vals=Array.from({length:8},(_,i)=>{let w=i+1,l=log(w,d),v=l['ex'+selection+'s0']||{},value=selection==='run'?runSeconds(l.runTime):v[progressMetric];return {w,date:dateFor(w,d),value:value===undefined||value===null||value===''?null:Number(value),done:!!l.done}});
let valid=vals.filter(x=>x.value!==null&&Number.isFinite(x.value)),lo=valid.length?Math.min(...valid.map(x=>x.value)):0,hi=valid.length?Math.max(...valid.map(x=>x.value)):1,span=hi-lo||1;
let coords=valid.map(x=>[35+(x.w-1)*76,150-(x.value-lo)/span*110]);
let chart=valid.length?'<svg viewBox="0 0 620 190" style="width:100%" role="img" aria-label="Eight-week progression"><line x1="35" y1="150" x2="580" y2="150" stroke="#64748b"/>'+Array.from({length:8},(_,i)=>'<text x="'+(35+i*76)+'" y="174" fill="#aab4c5" text-anchor="middle" font-size="12">'+(i+1)+'</text>').join('')+(coords.length>1?'<polyline points="'+coords.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#4ade80" stroke-width="3"/>':'')+coords.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#4ade80"/><text x="'+p[0]+'" y="'+(p[1]-9)+'" fill="white" text-anchor="middle" font-size="12">'+valid[i].value+'</text>').join('')+'</svg>':'<p>Log this exercise to start your graph.</p>';
return '<div class="card"><h2>Workout progression</h2><label>Training day <select class="wide" onchange="progressDay=+this.value;progressExercise=0;progressMetric=\'weight\';render()">'+DAYS.slice(0,5).map((x,i)=>'<option value="'+i+'" '+(i===d?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Exercise <select class="wide" onchange="progressExercise=+this.value;progressMetric=progressExercise===-1?\'run\':\'weight\';render()">'+(isRun?'<option value="-1" '+(progressExercise===-1?'selected':'')+'>2 km run</option>':'')+ex.map((e,i)=>'<option value="'+i+'" '+(progressExercise===i?'selected':'')+'>'+escape(e[0])+'</option>').join('')+'</select></label>'+(selection==='run'?'<p>Run time in seconds (lower is faster)</p>':'<label>Measure <select onchange="progressMetric=this.value;render()"><option value="weight" '+(progressMetric==='weight'?'selected':'')+'>Weight / load</option><option value="reps" '+(progressMetric==='reps'?'selected':'')+'>Reps / seconds</option></select></label><p>First logged set per week.</p>')+chart+'<div style="overflow-x:auto"><table><tr><th>Week</th><th>Date</th><th>Result</th><th>Completed</th></tr>'+vals.map(x=>'<tr><td>'+x.w+'</td><td>'+x.date+'</td><td>'+(x.value===null?'—':x.value)+'</td><td>'+(x.done?'Yes':'No')+'</td></tr>').join('')+'</table></div></div>';
}
function runSeconds(t){let m=/^(\d+):(\d{1,2})$/.exec(String(t||''));return m?+m[1]*60+(+m[2]):null}

function progress(){let entries=Object.entries(db.logs).filter(([k,v])=>v.done).sort((a,b)=>{let [wa,da]=a[0].split('-').map(Number),[wb,dbb]=b[0].split('-').map(Number);return wb-wa||dbb-da});let runs=entries.filter(([k])=>[1,3,5].includes(+k.split('-')[1])),weights=weightEntries(),first=weights[0],last=weights.at(-1);return `${programEnded()?endCelebration():''}<div class="grid"><div class="card"><div class="muted">Completed workouts</div><div class="stats">${entries.length}/40</div></div><div class="card"><div class="muted">Logged runs</div><div class="stats">${runs.length}</div></div><div class="card"><div class="muted">Program end date</div><div class="stats" style="font-size:19px">${endDate()}</div></div></div>${workoutProgress()}<div class="card"><h2>Body weight progression</h2><div class="row"><label>Date <input type="date" id="weighDate" value="${localISO(new Date())}"></label><label>Weight (lb) <input id="weighValue" type="number" step="0.1" min="70" max="700" placeholder="210"></label><button class="primary" onclick="recordWeight()">Add weigh-in</button></div>${weightGraph()}${first&&last?`<p>First: ${fmtWeight(first[1])} lb · Latest: ${fmtWeight(last[1])} lb · Change: ${(+last[1]-+first[1])>0?'+':''}${fmtWeight(+last[1]-+first[1])} lb</p>`:''}<small>Daily weight fluctuates with water, meals and training. Compare weekly averages for a clearer trend.</small></div><div class="card"><h2>Recent sessions and improvement notes</h2>${entries.length?entries.slice(0,15).map(([k,v])=>{let[w,d]=k.split('-').map(Number);return `<details style="border-bottom:1px solid #334155;padding:9px 0"><summary>W${w} · ${DAYS[d]} ${escape(v.runTime||'')} ${v.minutes?' · '+escape(v.minutes)+' min':''}</summary>${summary(w,d)}</details>`}).join(''):'<p>Complete a workout to start your history.</p>'}</div><div class="card"><h2>Back up your data</h2><p>Entries are stored on this device in this browser. Export a backup regularly.</p><button onclick="exportData()">Export JSON backup</button></div>`}


function setNutrition(k,v){db.nutrition[calorieDate]||={};db.nutrition[calorieDate][k]=v;save();render()}
function calories(){
let n=db.nutrition[calorieDate]||{},weight=Number(db.weights[calorieDate]||db.settings.weight)||210,kg=weight*.45359237,bmr=10*kg+6.25*Number(db.settings.height)-5*Number(db.settings.age)+(db.settings.sex==='female'?-161:5),steps=Math.max(0,Number(n.steps)||0),eaten=n.eaten===undefined||n.eaten===''?null:Number(n.eaten);
let key=Object.keys(db.logs).find(k=>{let [w,d]=k.split('-').map(Number);return d<5&&dateFor(w,d)===calorieDate}),L=key?db.logs[key]:{},d=key?+key.split('-')[1]:null,mins=Math.max(0,Number(L.minutes)||0);
let exercise=Math.round(mins*(d===1||d===3?4.5:3.5)*3.5*kg/200),run=L.runTime&&runSeconds(L.runTime)!==null?Math.round(2*kg*.95):0,walking=Math.round(steps*kg*.00045),out=Math.round(bmr*1.2+walking+exercise+run),balance=eaten===null?null:out-eaten;
return '<div class="card"><h2>Calories in vs out</h2><label>Date <input type="date" value="'+calorieDate+'" onchange="calorieDate=this.value;render()"></label><div class="grid"><label>Calories eaten <input class="wide" type="number" min="0" value="'+escape(n.eaten??'')+'" onchange="setNutrition(\'eaten\',this.value)"></label><label>Steps today (enter manually) <input class="wide" type="number" min="0" value="'+escape(n.steps??'')+'" onchange="setNutrition(\'steps\',this.value)"></label></div><p>Copy your daily step count from Apple Health. No Apple Health connection is needed.</p></div><div class="card"><h2>Estimated daily calories</h2><table><tr><td>Weight</td><td>'+fmtWeight(weight)+' lb</td></tr><tr><td>BMR</td><td>'+Math.round(bmr)+' kcal</td></tr><tr><td>Baseline (BMR × 1.2)</td><td>'+Math.round(bmr*1.2)+' kcal</td></tr><tr><td>Steps</td><td>'+walking+' kcal</td></tr><tr><td>Workout</td><td>'+(exercise+run)+' kcal</td></tr><tr><th>Total calories out</th><th>'+out+' kcal</th></tr><tr><td>Calories eaten</td><td>'+(eaten===null?'Not entered':eaten+' kcal')+'</td></tr><tr><th>Estimated balance</th><th>'+(balance===null?'Enter calories eaten':balance>0?Math.round(balance)+' kcal deficit':balance<0?Math.round(-balance)+' kcal surplus':'Maintenance')+'</th></tr></table><p><small>Approximate values only. Workout calories use logged workout minutes and body weight, not exact calories per exercise. Step and workout estimates can overlap.</small></p></div><div class="card"><h2>BMR settings</h2><div class="grid"><label>Age <input class="wide" type="number" value="'+escape(db.settings.age)+'" onchange="db.settings.age=+this.value;save();render()"></label><label>Height (cm) <input class="wide" type="number" value="'+escape(db.settings.height)+'" onchange="db.settings.height=+this.value;save();render()"></label><label>Sex for equation <select class="wide" onchange="db.settings.sex=this.value;save();render()"><option value="male" '+(db.settings.sex==='male'?'selected':'')+'>Male</option><option value="female" '+(db.settings.sex==='female'?'selected':'')+'>Female</option></select></label><label>Default weight (lb) <input class="wide" type="number" value="'+escape(db.settings.weight)+'" onchange="db.settings.weight=+this.value;save();render()"></label></div><p>Uses the Mifflin-St Jeor BMR equation. Record a weigh-in for a specific date to use that day’s weight.</p></div>';
}

function settings(){return `<div class="card"><h2>Program settings</h2><label>Week 1 Monday start date <input type="date" value="${escape(db.settings.start)}" onchange="db.settings.start=this.value;save();render()"></label><p><label>Body weight (lb) <input type="number" value="${escape(db.settings.weight)}" onchange="db.settings.weight=this.value;save()"></label></p><p><strong>Program end date: ${endDate()}</strong> (Sunday of week 8).</p><p>Choose a Monday as your start date. The Home tab detects the current weekday and training week automatically. Workout fields save as you type.</p></div><div class="card"><h2>Data management</h2><button onclick="exportData()">Export backup</button> <label>Import backup <input type="file" accept="application/json" onchange="importData(this.files[0])"></label><p><small>Data does not sync between devices. Clearing browser storage can erase entries; use export/import to preserve them.</small></p><button class="danger" onclick="if(confirm('Erase all FORGE data on this device?')){localStorage.removeItem(KEY);location.reload()}">Reset all data</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='forge-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(f){if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x.logs||!x.settings)throw Error('Invalid backup');if(confirm('Replace current data with backup?')){db=x;db.weights ||= {};save();render()}}catch(e){alert('Unable to import backup: '+e.message)}};reader.readAsText(f)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
